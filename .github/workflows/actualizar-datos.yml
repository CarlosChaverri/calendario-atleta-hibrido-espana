name: Actualizar datos de carreras
on:
  schedule:
    - cron: '23 5 1,16 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerar dataset
        run: python3 scripts/build_dataset.py --refresh
      - name: Comprobar webs oficiales
        run: python3 scripts/check_official_sites.py
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/races.json data/races_full.json data/stats.json data/geocache.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos actualizados ($(date +%Y-%m-%d))"
            git push
          fi
